name = "monir-website-admin"
main = "src/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/auth/*", "/api/*"]

[[kv_namespaces]]
binding = "ADMIN_SESSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
GITHUB_OWNER = "monircse061"
GITHUB_REPO = "webpage"
GITHUB_BRANCH = "main"
GITHUB_ALLOWED_USER = "monircse061"
GITHUB_SCOPE = "read:user"
